name: E2E Tests (PoC trim)

# Trimmed replica of 1Password/kubernetes-secrets-injector .github/workflows/e2e-tests.yml.
# Security-relevant parts kept identical: `ref` input is checked out and the three
# OP_* secrets are passed to a command that comes from the checked-out (untrusted) code.
# The kind-cluster / Go setup steps were dropped to keep the PoC fast.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        required: true
        type: string
    secrets:
      OP_CONNECT_CREDENTIALS:
        description: "1Password Connect credentials"
        required: true
      OP_CONNECT_TOKEN:
        description: "1Password Connect token"
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        description: "1Password service account token"
        required: true

permissions:
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Create '1password-credentials.json' file
        env:
          OP_CONNECT_CREDENTIALS: ${{ secrets.OP_CONNECT_CREDENTIALS }}
        run: |
          echo "$OP_CONNECT_CREDENTIALS" > 1password-credentials.json

      - name: Run E2E tests
        run: make test-e2e
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
